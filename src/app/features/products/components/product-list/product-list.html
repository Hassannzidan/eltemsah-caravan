<div class="space-y-6">
  <ng-container *ngFor="let product of products">
    <div 
        class="flex flex-col md:flex-row overflow-hidden transition-shadow hover:shadow-lg rounded-xl border border-gray-200 bg-white"
        >
      
      <!-- صورة المنتج -->
      <div class="w-full md:w-64 h-48 md:h-auto">
        <img 
          [src]="product.images[0]" *ngIf="product.images?.length"
          [alt]="product.name" 
          class="w-full h-full object-cover" 
          loading="lazy"
          decoding="async"/>
      </div>

      <!-- تفاصيل المنتج -->
      <div class="flex-1 p-6">
        <div class="flex justify-between items-start mb-4">
          <div>
            <h3 class="text-xl font-bold text-slate-900 mb-2">{{ product.name }}</h3>
            <p class="text-sm text-red-600 font-semibold mb-2">{{ product.category }}</p>
            <ng-container *ngIf="product.subcategory">
              <span class="inline-block bg-slate-100 text-slate-700 px-3 py-1 rounded-full text-sm">
                {{ product.subcategory }}
              </span>
            </ng-container>
          </div>
          <a [routerLink]="['/product', product._id]">
            <button variant="outline" class="shadcn-btn-outline">Learn More</button>
          </a>
        </div>
        <p class="text-slate-600">{{ product.description }}</p>

        <!-- <div *ngIf="product.tags?.length" class="flex flex-wrap gap-2 mt-4">
          <span
            *ngFor="let tag of product.tags"
            class="badge border border-gray-300/50 bg-white text-slate-800 px-2 py-1 text-xs rounded-xl"
          >
            {{ tag }}
          </span>
        </div> -->

      </div>
    </div>
  </ng-container>
</div>
