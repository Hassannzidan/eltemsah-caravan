        <!-- Custom Category Dropdown with Responsive Icon Position -->
        <div class="flex flex-row-reverse lg:flex-row items-center gap-2 w-full max-w-xs relative">
          <!-- Filter Icon -->
          <!-- <span class="text-slate-600 text-xl w-5 h-5">
            <ng-icon name="featherFilter" />
          </span> -->

          <button
            type="button"
            (click)="showCategoryMenu = !showCategoryMenu"
            class="text-slate-600 text-xl w-5 h-5 focus:outline-none hover:text-red-600 cursor-pointer"
            aria-label="Toggle category filter"
          >
            <span class="text-slate-600 text-xl w-5 h-5">
            <ng-icon name="featherFilter" />
            </span>
          </button>
          <!-- Dropdown Button -->
          <div class="relative w-full">
            <button
              (click)="showCategoryMenu = !showCategoryMenu"
              class="relative flex h-12 w-full items-center rounded-md border border-gray-300 bg-white text-base px-4 pr-10 text-left focus:outline-none focus:ring-2 focus:ring-red-800"
              aria-haspopup="listbox"
              [attr.aria-expanded]="showCategoryMenu"
              aria-label="Category filter"
            >
              <span class="truncate">{{ selectedCategory || 'All Categories' }}</span>
              <span class="absolute right-3 w-4 h-4 text-md pointer-events-none">
                <ng-icon [name]="showCategoryMenu ? 'featherChevronUp' : 'featherChevronDown'"></ng-icon>
              </span>
            </button>

            <!-- Dropdown List -->
            <ul
              role="listbox"
              tabindex="-1"
              [ngClass]="{
                'opacity-100 scale-100 translate-y-0 pointer-events-auto': showCategoryMenu,
                'opacity-0 scale-95 -translate-y-2 pointer-events-none': !showCategoryMenu
              }"
              class="absolute left-0 mt-1 pb-1 z-50 max-h-60 overflow-auto min-w-full origin-top rounded-md border border-gray-300 bg-white text-sm shadow-md transition-all duration-200 ease-in-out"
            >
              <li
                role="option"
                (click)="onCategoryChange('all'); showCategoryMenu = false"
                class="px-4 pl-10 py-2 cursor-pointer hover:bg-red-100 hover:text-red-600 relative flex items-center"
              >
                All Categories
                <ng-icon *ngIf="selectedCategory === 'all'" name="featherCheck" class="absolute left-3 text-lg text-red-600"></ng-icon>
              </li>

              <li
                *ngFor="let category of categories"
                role="option"
                [attr.aria-selected]="selectedCategory === category"
                (click)="onCategoryChange(category); showCategoryMenu = false"
                class="px-4 pl-10 py-2 cursor-pointer hover:bg-red-100 hover:text-red-600 relative flex items-center"
              >
                {{ category }}
                <ng-icon *ngIf="selectedCategory === category" name="featherCheck" class="absolute left-3 text-lg text-red-600"></ng-icon>
              </li>
            </ul>
          </div>
        </div>

    <!-- status drop down  -->
    <div *ngIf="showStatusFilter" class="w-full max-w-xs relative">
      <label class="sr-only" for="statusFilter">Status Filter</label>

      <!-- الأيقونة -->
      <span class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-gray-900">
        <ng-icon name="featherChevronDown" class="w-4 h-4" />
      </span>

      <select
        id="statusFilter"
        [value]="statusFilter"
        (change)="onStatusFilterChange($any($event.target).value)"
        class="w-full h-12 px-3 pr-10 py-2 border border-slate-300 rounded-lg bg-white text-base appearance-none"
      >
        <option value="all">All Status</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
</div>



      <!-- View Mode Toggle -->
      <div class="flex items-center gap-2">
        <!-- Grid Button -->
        <button
          type="button"
          (click)="onViewModeChange('grid')"
          [ngClass]="viewMode === 'grid' ? 'bg-red-800 text-white/90 hover:bg-red-800/90' : 'border border-gray-300 bg-gray-50 hover:bg-red-700/20 hover:text-red-600/90'"
          class=" cursor-pointer inline-flex items-center justify-center h-10 w-10 rounded-md text-sm font-medium  ring-offset-white transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-800 focus-visible:ring-offset-2"
          aria-label="Grid view"
          [attr.aria-pressed]="viewMode === 'grid'"
          >
          <span class="text-2xl flex justify-center items-center">
            <ng-icon name="lucideGrid3x3" />
          </span>
        </button>

        <!-- List Button -->
        <button
          type="button"
          (click)="onViewModeChange('list')"
          [ngClass]="viewMode === 'list' ? 'bg-red-800 text-white/90 hover:bg-red-800/80' : 'border border-gray-300 bg-gray-50 hover:bg-red-700/20 hover:text-red-600/90'"
          class="cursor-pointer inline-flex items-center justify-center h-10 w-10 rounded-md text-sm font-medium ring-offset-white transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-800 focus-visible:ring-offset-2"
          aria-label="List view"
          [attr.aria-pressed]="viewMode === 'list'"
          >
          <span class="text-2xl flex justify-center items-center">
            <ng-icon name="heroListBulletSolid" />   
          </span>
        </button>
      </div>
    </div>

    <!-- Results Count -->
    <div class="mt-4  text-slate-600">
      Showing {{ filteredProductsCount }} products
      <ng-container *ngIf="selectedCategory !== 'all'"> in {{ selectedCategory }}</ng-container>
      <ng-container *ngIf="searchTerm"> matching "{{ searchTerm }}"</ng-container>
    </div>
  </div>
</section>
