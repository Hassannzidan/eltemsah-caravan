<ng-container *ngIf="specifications?.length">
  <div class="collapsible">
    <div class="card">
      <div
        class="card-header cursor-pointer hover:bg-slate-50 transition-colors"
        (click)="toggleSpecs()"
      >
        <div class="card-title flex items-center justify-between">
          <div class="flex items-center gap-2">
            <svg class="w-5 h-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path d="M12 2v20M2 12h20" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
            </svg>
            Technical Specifications
          </div>
          <div class="chevron-icon">
            <svg *ngIf="isSpecsOpen()" class="w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
            </svg>
            <svg *ngIf="!isSpecsOpen()" class="w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path d="M19 15l-7-7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
            </svg>
          </div>
        </div>
      </div>

      <div *ngIf="isSpecsOpen()">
        <div class="card-content space-y-6">
          <ng-container *ngFor="let category of specifications">
            <div class="category">
              <h3 class="text-base font-semibold text-slate-800 border-b pb-1 mb-2">
                {{ category.title }}
              </h3>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <ng-container *ngFor="let spec of category.specifications">
                  <div *ngIf="spec.isVisible" class="spec-item border-l-2 border-slate-200 pl-4">
                    <dt class="font-medium text-slate-900 text-sm">{{ spec.key }}</dt>
                    <dd class="text-slate-600 text-sm mt-1">{{ spec.value }}</dd>
                  </div>
                </ng-container>
              </div>
            </div>
          </ng-container>
        </div>
      </div>
    </div>
  </div>
</ng-container>
