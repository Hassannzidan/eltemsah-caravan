<div class="min-h-screen bg-gray-100 text-gray-900 flex justify-center">
  <div class="max-w-screen-xl m-0 sm:m-10 bg-white shadow sm:rounded-lg flex justify-center flex-1">
    <div class="lg:w-1/2 xl:w-5/12 p-6 sm:p-12">
      <a routerLink="/">
        <span class="text-[#8b0000] font-Staatliches font-bold self-center text-center text-3xl tracking-wider flex flex-col">
          <span> TEMSAH </span>
          <span> CARAVAN </span>
        </span>
      </a>

      <div class="mt-12 flex flex-col items-center">
        <h1 class="text-2xl xl:text-3xl font-extrabold">Sign In</h1>
        <h2 class="text-xl xl:text-2xl font-bold my-3 font-Antonio">Welcome Back to eltemsah</h2>

        <div class="w-full flex-1 mt-8">
          <form (ngSubmit)="login()" #loginForm="ngForm" class="mx-auto max-w-xs">
            <input
              [(ngModel)]="email"
              name="email"
              type="email"
              required
              placeholder="Email"
              class="w-full px-8 py-4 rounded-lg font-medium bg-gray-100 border border-gray-200 placeholder-gray-500 text-sm focus:outline-none focus:border-gray-400 focus:bg-white"
            />
            <input
              [(ngModel)]="password"
              name="password"
              type="password"
              required
              placeholder="Password"
              class="w-full px-8 py-4 rounded-lg font-medium bg-gray-100 border border-gray-200 placeholder-gray-500 text-sm focus:outline-none focus:border-gray-400 focus:bg-white mt-5"
            />
            <button
              type="submit"
              [disabled]="loginForm.invalid"
              class="cursor-pointer mt-5 tracking-wide font-semibold bg-red-700 hover:bg-red-500/80 text-gray-100 w-full py-4 rounded-lg transition-all duration-300 ease-in-out flex items-center justify-center focus:shadow-outline focus:outline-none"
            >
              <svg class="w-6 h-6 -ml-2" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
                <circle cx="8.5" cy="7" r="4" />
                <path d="M20 8v6M23 11h-6" />
              </svg>
              <span class="ml-3">Sign In</span>
            </button>

            <!-- رسالة الخطأ -->
            <p *ngIf="error" class="mt-3 text-sm text-red-600 text-center">{{ error }}</p>
          </form>

          <div class="my-12 border-b text-center">
            <div class="leading-none px-2 inline-block text-sm text-gray-600 tracking-wide font-medium bg-white transform translate-y-1/2">
              This is where decisions begin.
            </div>
          </div>

          <p class="mt-6 text-xs text-gray-600 text-center">
            © 2025 Eltemsaah . Crafted by Hassan Zidan.
          </p>
        </div>
      </div>
    </div>

    <div class="flex-1 bg-red-100 text-center hidden lg:flex">
      <div class="m-12 xl:m-16 w-full bg-contain bg-center bg-no-repeat"
           style="background-image: url('https://storage.googleapis.com/devitary-image-host.appspot.com/15848031292911696601-undraw_designer_life_w96d.svg');">
      </div>
    </div>
  </div>
</div>
