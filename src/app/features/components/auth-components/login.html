<div
  class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 flex items-center justify-center p-4 relative"
>
  <!-- Background Pattern -->
  <div
    class="absolute inset-0 opacity-30"
    [style.background-image]="backgroundPattern"
  ></div>

  <div class="relative w-full max-w-md">
    <!-- Header -->
    <div class="text-center mb-8 animate-fade-in">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-orange-600 rounded-full mb-4 shadow-lg">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.5 3.8 10.74 9 12 5.2-1.26 9-6.5 9-12V5l-9-4z"/></svg>
      </div>
      <h1 class="text-3xl font-bold text-white mb-2">Admin Portal</h1>
      <p class="text-slate-400">Sign in to access the dashboard</p>
    </div>

    <!-- Login Card -->
    <div class="backdrop-blur-sm bg-white/10 border border-white/20 shadow-2xl rounded-lg p-6 animate-fade-in">
      <form [formGroup]="form" (ngSubmit)="login()" class="space-y-6">
        <!-- Email Field -->
        <div class="space-y-2">
          <label for="email" class="text-white font-medium">Email Address</label>
          <div class="relative">
            <input
              id="email"
              type="email"
              formControlName="email"
              placeholder="admin@company.com"
              class="pl-10 pr-3 py-2 w-full rounded-md bg-white/10 border border-white/20 text-white placeholder:text-slate-400 focus:border-orange-500 focus:ring-orange-500"
              required
            />
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-8 0v2m-4-4V7a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v10"/></svg>
          </div>
        </div>

        <!-- Password Field -->
        <div class="space-y-2">
          <label for="password" class="text-white font-medium">Password</label>
          <div class="relative">
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              id="password"
              placeholder="Enter your password"
              class="pl-10 pr-10 py-2 w-full rounded-md bg-white/10 border border-white/20 text-white placeholder:text-slate-400 focus:border-orange-500 focus:ring-orange-500"
              required
            />
            <button
              type="button"
              (click)="togglePassword()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white"
            >
              <svg *ngIf="!showPassword" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 1l22 22M17.94 17.94A10.5 10.5 0 0 1 12 19.5c-5.5 0-10-4.5-10-10a10.5 10.5 0 0 1 1.56-5.55M6.1 6.1A9.77 9.77 0 0 1 12 4.5c5.5 0 10 4.5 10 10a9.77 9.77 0 0 1-1.64 5.55"/></svg>
              <svg *ngIf="showPassword" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <!-- Error Message -->
        <div *ngIf="error" class="text-red-400 bg-red-500/10 border border-red-500/20 px-4 py-2 rounded text-sm">
          {{ error }}
        </div>

        <!-- Login Button -->
        <button
          type="submit"
          [disabled]="isLoading"
          class="w-full bg-orange-600 hover:bg-orange-700 text-white font-medium py-3 rounded transition-all duration-200"
        >
          <ng-container *ngIf="isLoading; else signInText">
            <span class="flex items-center justify-center">
              <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin mr-2"></span>
              Signing in...
            </span>
          </ng-container>
          <ng-template #signInText>Sign In to Dashboard</ng-template>
        </button>
      </form>

      <!-- Demo Credentials -->
      <div class="mt-6 p-4 bg-blue-500/10 border border-blue-500/20 rounded-lg text-blue-300 text-sm">
        <p class="font-medium mb-2">Demo Credentials:</p>
        <p>{{email}}</p>
        <p>Password: admin123</p>
      </div>
    </div>

    <!-- Footer -->
    <div class="text-center mt-6">
      <p class="text-slate-400 text-sm">
        Secure admin access for authorized personnel only
      </p>
    </div>
  </div>
</div>
