<div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start p-4">
  <!-- Left Info Section -->
  <div class="space-y-6 py-10 px-6 lg:px-10">
    <h2 class="text-4xl font-bold text-red-900">Headquarter</h2>
    <h3 class="text-xl font-semibold text-gray-700">Kerdasa, Giza Governorate</h3>

    <!-- Location -->
    <div class="flex items-start gap-4">
      <div class="bg-red-100 text-red-700 p-3 rounded-full">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2"
             viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 6-9 13-9 13S3 16 3 10a9 9 0 1 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
      </div>
      <p class="text-gray-600">
        Km 28 Alex desert road, beside smart village<br />Giza, Egypt
      </p>
    </div>

    <!-- Email -->
    <div class="flex items-center gap-4">
      <div class="bg-red-100 text-red-700 p-3 rounded-full">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2"
             viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16v16H4z" fill="none"/>
          <polyline points="4,4 12,13 20,4"/>
        </svg>
      </div>
      <p class="text-gray-600">{{email}}</p>
    </div>

    <!-- Phone -->
    <div class="flex items-center gap-4">
      <div class="bg-red-100 text-red-700 p-3 rounded-full">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2"
             viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.14
                   19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.1 4.18 2 2 0 0 1
                   4.1 2h3a2 2 0 0 1 2 1.72c.12.81.37 1.6.72 2.34a2 2 0 0 1-.45
                   2.11L8.09 9.91a16 16 0 0 0 6 6l1.74-1.74a2 2 0 0 1 2.11-.45c.74.35
                   1.53.6 2.34.72a2 2 0 0 1 1.72 2z"/>
        </svg>
      </div>
      <p class="text-gray-600">011 02012009</p>
    </div>

    <!-- Social Icons -->
    <div class="flex gap-4 pt-4">
      <a href="https://www.facebook.com/temsahcaravan/" target="_blank" class="text-gray-500 hover:text-red-700 transition">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
          <path d="M22 12a10 10 0 1 0-11.45 9.95v-7.05h-2.18V12h2.18V9.8c0-2.15 1.28-3.34 3.25-3.34.94 0 1.92.17 1.92.17v2.1h-1.08c-1.06 0-1.39.66-1.39 1.34V12h2.37l-.38 2.9h-1.99v7.05A10 10 0 0 0 22 12z"/>
        </svg>
      </a>
      <a href="#" class="text-gray-500 hover:text-red-700 transition">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
          <path d="M7.75 2A5.75 5.75 0 0 0 2 7.75v8.5A5.75 5.75 0 0 0 7.75 22h8.5A5.75 5.75 0 0 0 22 16.25v-8.5A5.75 5.75 0 0 0 16.25 2h-8.5zm8.5 1.5a4.25 4.25 0 0 1 4.25 4.25v8.5a4.25 4.25 0 0 1-4.25 4.25h-8.5A4.25 4.25 0 0 1 3.5 16.25v-8.5A4.25 4.25 0 0 1 7.75 3.5h8.5zM12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 1.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zm5.25-.88a1.13 1.13 0 1 0 0 2.25 1.13 1.13 0 0 0 0-2.25z"/>
        </svg>
      </a>
    </div>
  </div>

  <!-- Right Map and Buttons -->
  <div class="flex flex-col gap-4 px-4">
    <div class="w-full h-96 lg:h-[500px] rounded-lg overflow-hidden shadow-md">
      <iframe
        src="https://maps.google.com/maps?q=30.059611,31.010531&z=15&output=embed"
        width="100%"
        height="100%"
        style="border:0"
        allowfullscreen
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        title="Headquarter Location"
      ></iframe>
    </div>

    <!-- Buttons -->
    <div class="flex flex-col sm:flex-row gap-3">
      <a
        href="https://www.google.com/maps?q=30.059611,31.010531"
        target="_blank"
        rel="noopener noreferrer"
        class="flex-1 px-5 py-3 text-center rounded-lg bg-red-600 text-white hover:bg-red-700 shadow transition"
      >
        عرض على Google Maps
      </a>

      <button
        (click)="openDirections()"
        class="flex-1 px-5 py-3 text-center rounded-lg bg-white text-red-700 border border-red-300 hover:bg-red-50 shadow transition"
      >
        الاتجاه من موقعي الحالي
      </button>
    </div>
  </div>
</div>
