<section class="relative bg-gray-50 py-8 sm:py-12  lg:py-16  pt-24 sm:pt-28 lg:pt-32  ">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="bg-white/90 backdrop-blur-sm rounded-2xl shadow-2xl overflow-hidden -mt-50">
      <div class="grid lg:grid-cols-2 gap-0">
        
        <!-- Left - Visual -->
        <div class="relative order-2 lg:order-1 hidden sm:block">
          <div class="h-64 sm:h-80 lg:h-full bg-cover bg-center relative min-h-[400px]" loading="lazy"
           style="background-image: url('https://images.unsplash.com/photo-1587560699334-bea93391dcef?q=80&w=1170&auto=format&fit=crop&w=2070&q=80')">
            <div class="absolute inset-0 bg-black/20"></div>
            <div class="absolute inset-0 bg-blue-400/10"></div>
          </div>

          <div class="absolute bottom-4 left-4 right-4 sm:bottom-6 sm:left-6 sm:right-6 lg:bottom-8 lg:left-8 lg:right-8">
            <div class="bg-red-800 text-white p-4 sm:p-6 rounded-xl shadow-lg">
              <p class="text-sm sm:text-base mb-3 sm:mb-4 leading-relaxed">
                {{ 'requestQuote.responseTime' | translate }}
              </p>
              <div class="flex items-center gap-3">
                 <span class="w-5 h-5 text-xl" >
                  <ng-icon name="lucidePhone" />
                 </span>
                <span class="text-lg sm:text-xl lg:text-2xl font-bold tracking-wide">
                  {{ 'requestQuote.phone' | translate }}
                </span>
              </div>
            </div>
          </div>
        </div>

        <!-- Right - Form -->
        <div class="p-6 sm:p-8 lg:p-12 order-1 lg:order-2">
          <div class="max-w-md mx-auto lg:mx-0">
            <h2 class="text-2xl sm:text-3xl lg:text-4xl font-bold bg-gradient-to-r from-red-800 to-orange-500 text-transparent bg-clip-text mb-4">{{ 'requestQuote.title' | translate }}</h2>
            <p class="text-gray-600 mb-6 sm:mb-8 leading-relaxed text-sm sm:text-base">
              {{ 'requestQuote.description' | translate }}
            </p>

            <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4 sm:space-y-6">
              <input formControlName="name" type="text" placeholder="{{ 'requestQuote.namePlaceholder' | translate }}"
                class="w-full h-11 sm:h-12 rounded-lg bg-gray-50 border-2 border-gray-200 px-4 placeholder:text-gray-500 text-gray-900 transition-all duration-200 focus:outline-none focus:border-red-500 focus:bg-white focus:ring-2 focus:ring-red-100 hover:border-red-300"
              />

              <input formControlName="email" type="email" placeholder="{{ 'requestQuote.emailPlaceholder' | translate }}"
                class="w-full h-11 sm:h-12 rounded-lg bg-gray-50 border-2 border-gray-200 px-4 placeholder:text-gray-500 text-gray-900 transition-all duration-200 focus:outline-none focus:border-red-500 focus:bg-white focus:ring-2 focus:ring-red-100 hover:border-red-300"
              />

              <input formControlName="phone" type="tel" placeholder="{{ 'requestQuote.phonePlaceholder' | translate }}"
                class="w-full h-11 sm:h-12 rounded-lg bg-gray-50 border-2 border-gray-200 px-4 placeholder:text-gray-500 text-gray-900 transition-all duration-200 focus:outline-none focus:border-red-500 focus:bg-white focus:ring-2 focus:ring-red-100 hover:border-red-300"
              />

              <select formControlName="industry"
              
              class="w-full h-11 sm:h-12 rounded-lg bg-gray-50 border-2 
              border-gray-200 px-4 text-gray-500 text-sm sm:text-base truncate 
              transition-all duration-200 hover:border-red-300 focus:outline-none focus:border-red-500 
              focus:bg-white focus:ring-2 focus:ring-red-100"
              style="text-overflow: ellipsis; white-space: nowrap; overflow: hidden;">


                <option value="" disabled selected>{{ 'requestQuote.industryPlaceholder' | translate }}</option>
                <option class="w-fit" value="manufacturing">{{ 'requestQuote.industryOptions.manufacturing' | translate }}</option>
                <option value="construction">{{ 'requestQuote.industryOptions.construction' | translate }}</option>
                <option value="automotive">{{ 'requestQuote.industryOptions.automotive' | translate }}</option>
                <option value="aerospace">{{ 'requestQuote.industryOptions.aerospace' | translate }}</option>
                <option value="energy">{{ 'requestQuote.industryOptions.energy' | translate }}</option>
                <option value="mining">{{ 'requestQuote.industryOptions.mining' | translate }}</option>
                <option value="other">{{ 'requestQuote.industryOptions.other' | translate }}</option>
              </select>



              <textarea formControlName="details" placeholder="{{ 'requestQuote.detailsPlaceholder' | translate }}"
                class="w-full min-h-[100px] sm:min-h-[120px] rounded-lg bg-gray-50 border-2 border-gray-200 px-4 py-3 placeholder:text-gray-500 text-gray-900 resize-none transition-all duration-200 focus:outline-none focus:border-red-500 focus:bg-white focus:ring-2 focus:ring-red-100 hover:border-red-300" rows="4">
              </textarea>

              <button type="submit"
                aria-label="Submit Quote Request"
                class="w-full h-11 sm:h-12 bg-black hover:bg-red-800 text-white rounded-lg 
                      flex items-center justify-center gap-2 font-medium duration-200 
                      transform hover:scale-[1.02] active:scale-[0.98] hover:shadow-xl
                      bg-gradient-to-r from-red-700 to-orange-600 hover:from-red-800 hover:to-red-700 transition-all shadow-xl
                      ">
                {{ 'requestQuote.submitButton' | translate }}
                <!-- <app-arrow-right class="w-4 h-4"></app-arrow-right> -->
              </button>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>
