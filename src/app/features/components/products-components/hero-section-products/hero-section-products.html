<section
  role="region"
  aria-label="Our Services Section"
  class="relative py-20 sm:py-28 text-white overflow-hidden"
>
  <!-- Background image -->
  <div
    class="absolute inset-0 bg-cover bg-center"
    style="background-image: url('assets/backgrounds/products/products-background2.png');"
    aria-hidden="true"
  ></div>

  <!-- Blur layer -->
  <div class="absolute inset-0 backdrop-blur-sm" aria-hidden="true"></div>

  <!-- Blue & Red gradient overlay -->
  <div
    class="absolute inset-0 bg-gradient-to-br from-blue-900/30 via-transparent to-red-800/30"
    aria-hidden="true"
  ></div>

  <!-- Content -->
  <div class="relative container mx-auto px-4 sm:px-6 text-center z-10">
    <h1
      class="text-3xl sm:text-5xl font-extrabold mb-4 sm:mb-6 drop-shadow-xl bg-gradient-to-r from-red-800 via-red-600 to-red-700 bg-clip-text text-transparent"
    >
      {{ 'productPage.hero.title' | translate }}
    </h1>
    <p
      class="text-base sm:text-xl max-w-md sm:max-w-3xl mx-auto leading-relaxed drop-shadow-md"
    >
      {{ 'productPage.hero.description' | translate }}
    </p>
  </div>
</section>
