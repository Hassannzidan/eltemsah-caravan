<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
      <div *ngFor="let product of products" 
           class="rounded-lg border bg-card text-card-foreground shadow-sm group hover:shadow-xl transition-all duration-300 transform hover:-translate-y-2">

        <!-- Image Section -->
        <div class="relative h-48 overflow-hidden rounded-t-lg">
          <img [src]="product.image" 
               [alt]="product.name"
               class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" />
          <div class="absolute top-4 left-4" *ngIf="product.subcategory">
            <span class="bg-gradient-to-r from-orange-500 to-red-500 text-white px-3 py-1 rounded-full text-sm font-semibold">
              {{ product.subcategory }}
            </span>
          </div>
        </div>

        <!-- Header -->
        <div class="flex flex-col space-y-1.5 p-6">
          <h3 class="text-lg font-semibold leading-none tracking-tight group-hover:text-orange-600 transition-colors">
            {{ product.name }}
          </h3>
          <p class="text-sm text-slate-500">{{ product.category }}</p>
        </div>

        <!-- Content -->
        <div class="p-6 pt-0">
          <p class="text-slate-600 text-sm mb-4">{{ product.description }}</p>
          <a [routerLink]="['/product', product.id]">
            <button class="w-full inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium border border-input bg-background hover:bg-accent hover:text-accent-foreground h-10 px-4 py-2 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2">
              Learn More
            </button>
          </a>
        </div>
      </div>
    </div>
