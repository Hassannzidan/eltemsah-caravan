<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
  <div
    *ngFor="let product of products"
    class="group hover:shadow-xl transition-all duration-300 transform hover:-translate-y-2 rounded-lg border border-gray-300 bg-card text-card-foreground shadow-sm"
  >
    <div class="relative h-48 overflow-hidden rounded-t-lg">
      <img
        [src]="product.images"
        [alt]="product.name"
        class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"
      />
      <div class="absolute top-4 left-4">
        <span
          class="bg-gradient-to-r from-orange-500 to-red-500 text-white px-3 py-1 rounded-full text-sm font-semibold"
        >
          {{ product.subcategory }}
        </span>
      </div>

    </div>

    <div class="flex flex-col space-y-1.5 p-6">
      <h3
        class="text-2xl font-semibold leading-none tracking-tight group-hover:text-orange-600 transition-colors"
      >
        {{ product.name }}
      </h3>
      <p class="text-sm text-slate-500">{{ product.category }}</p>
    </div>

    <div class="p-6 pt-0">
      <p class="text-slate-600 text-sm mb-4">
        {{ product.description }}
      </p>
      
      <div *ngIf="product.tags?.length" class="flex flex-wrap gap-2 mb-4">
        <span *ngFor="let tag of product.tags" class="badge border border-gray-300/50 bg-white text-slate-800 px-2 py-1 text-xs rounded-xl">
          {{ tag }}
        </span>
      </div>

      <a
        [routerLink]="['/product', product._id]"
        class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium ring-red-800 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-gray-300 bg-white/90 hover:bg-red-100/70 hover:text-red-800/90 w-full h-10 px-4 py-2"
      >
        Learn More
      </a>
    </div>
  </div>
</div>
