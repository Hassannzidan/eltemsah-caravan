 <div class="rounded-lg border bg-white text-black shadow-sm">
      <div class="flex flex-col space-y-1.5 p-6">
        <h3 class="text-2xl font-semibold leading-none tracking-tight flex items-center gap-2">
          <!-- <eye class="w-5 h-5 text-blue-500" /> -->
            <span class="text-blue-500">
                <ng-icon name="lucideEye" class="w-5 h-5" />
            </span>
          Section Visibility
        </h3>
      </div>

      <div class="p-6 pt-0">
        <div class="space-y-3">
          <div
            class="flex items-center justify-between p-3 bg-slate-50 rounded-lg"
            *ngFor="let section of sections"
          >
            <div class="flex items-center gap-3">
              <ng-container *ngIf="section.isVisible; else hiddenIcon">
                <!-- <eye class="w-4 h-4 text-green-500" /> -->
                <span class="text-green-500">
                    <ng-icon name="lucideEye" class="w-4 h-4" />
                </span>

              </ng-container>
              <ng-template #hiddenIcon>
                <!-- <eye-off class="w-4 h-4 text-slate-400" /> -->
                <span class="text-slate-400">
                    <ng-icon name="lucideEyeOff" class="w-4 h-4" />
                </span>
              </ng-template>
              <span class="font-medium text-slate-900">{{ section.name }}</span>
            </div>
            <label class="inline-flex items-center cursor-pointer">
              <input
                type="checkbox"
                class="sr-only peer"
                [checked]="section.isVisible"
                (change)="toggleSection(section.id)"

              />
              <div
                class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-blue-500
                rounded-full peer peer-checked:bg-blue-600 transition-all duration-200"
              ></div>
              <div
                class="absolute w-5 h-5 bg-white border border-gray-300 rounded-full
                transform peer-checked:translate-x-5 transition-transform duration-200"
              ></div>
            </label>
          </div>
        </div>
      </div>
</div>
