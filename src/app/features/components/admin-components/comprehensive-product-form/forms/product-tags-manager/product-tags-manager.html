<div class="rounded-lg border bg-white text-gray-300/85 shadow-sm">
  <div class="flex flex-col space-y-1.5 p-6">
    <h3 class="text-lg font-semibold tracking-tight text-gray-900">Tags</h3>
  </div>
  <div class="p-6 pt-0 space-y-4">
    <div class="flex gap-2">
      <input
        [(ngModel)]="newTag"
        (keydown)="onKeyEnter($event)"
        placeholder="Add a tag"
        class="flex h-10 w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-800"
      />
      <button
        type="button"
        (click)="addTag()"
        class="h-10 w-10 flex items-center justify-center rounded-md bg-red-900 text-white hover:bg-red-700  cursor-pointer"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2"
          viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"></path>
        </svg>
      </button>
    </div>

    <div *ngIf="tags.length > 0" class="flex flex-wrap gap-2">
      <div
        *ngFor="let tag of tags"
        class="inline-flex items-center rounded-full border bg-gray-200 px-2.5 py-0.5 text-xs font-semibold"
      >
        {{ tag }}
        <button
          type="button"
          (click)="removeTag(tag)"
          class="ml-2 h-4 w-4 flex items-center justify-center rounded hover:text-red-500"
        >
          <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6L6 18M6 6l12 12"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
