<form (ngSubmit)="handleSubmit()" class="space-y-6">
  <!-- Tabs -->
  <div class="grid grid-cols-2 w-full border-b">
    <button type="button"
      class="py-2 text-center border-b-2"
      [class.border-orange-600]="activeTab() === 'basic'"
      (click)="activeTab.set('basic')">Basic Information</button>

    <button type="button"
      class="py-2 text-center border-b-2"
      [class.border-orange-600]="activeTab() === 'details'"
      (click)="activeTab.set('details')">Product Details</button>
  </div>

  <!-- Basic Tab -->
  <div *ngIf="activeTab() === 'basic'" class="space-y-6">

    <app-basic-product-form
      [formData]="formData()"
      [categories]="categories"
      [subcategories]="availableSubcategories"
      (formDataChange)="updateFormData($event)"
    />

   <app-product-image-upload
    [image]="formData().image"
    (imageChange)="updateImage($event)"
   />

  <app-product-tags-manager
    [tags]="formData().tags"
    (tagsChange)="updateTags($event)"
  />

  <!-- Details Tab -->  
  <div *ngIf="activeTab() === 'details'" class="space-y-6">
    <app-product-details-form
      [productDetails]="productDetails()"
      (productDetailsChange)="productDetails.set($event)"
    />
<!-- 
    <app-lead-time-form
      [leadTime]="productDetails().leadTime"
      [availability]="productDetails().availability"
      (leadTimeChange)="updateLeadTime($event)"
      (availabilityChange)="updateAvailability($event)"
    /> -->
  </div>

  <!-- Buttons -->
  <div class="flex justify-end gap-4 pt-4">
    <button type="button"
      class="px-4 py-2 border border-gray-400 rounded"
      (click)="cancel.emit()">Cancel</button>
    <button type="submit"
      class="px-4 py-2 bg-orange-600 hover:bg-orange-700 text-white rounded">
      {{ product ? 'Update Product' : 'Create Product' }}
    </button>
  </div>
  </div>
  <!-- End of Tabs Content -->
</form>
