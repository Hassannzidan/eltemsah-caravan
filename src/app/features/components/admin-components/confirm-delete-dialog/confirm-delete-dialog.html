<!-- confirm-delete-dialog.html -->
<div class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center">
  <div class="bg-white rounded-lg p-6 w-full max-w-md space-y-4 shadow-xl">
    <div *ngIf="step() === 1">
      <h2 class="text-xl font-bold text-slate-800">Confirm Deletion</h2>
      <p class="text-slate-600">
        Are you sure you want to delete "<strong>{{ productName }}</strong>"?
      </p>
      <div class="flex justify-end gap-2 mt-4">
        <button (click)="cancel.emit()" class="px-4 py-2 text-slate-600 hover:underline">Cancel</button>
        <button (click)="proceedToStep2()" class="px-4 py-2 bg-red-700 hover:bg-red-800 text-white rounded-md">Next</button>
      </div>
    </div>

    <div *ngIf="step() === 2">
      <h2 class="text-xl font-bold text-slate-800">Final Confirmation</h2>
      <p class="text-slate-600 mb-2">Please type the product name to confirm:</p>
      <input
        type="text"
        [(ngModel)]="confirmText"
        placeholder="Type '{{ productName }}'"
        class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-800"
      />
      <div class="flex justify-end gap-2 mt-4">
        <button (click)="cancel.emit()" class="px-4 py-2 text-slate-600 hover:underline">Cancel</button>
        <button
          [disabled]="!isMatching()"
          (click)="handleDelete()"
          class="px-4 py-2 rounded-md"
          [ngClass]="isMatching() ? 'bg-red-700 text-white hover:bg-red-800' : 'bg-gray-300 text-gray-500 cursor-not-allowed'"
        >
          Delete
        </button>
      </div>
    </div>
  </div>
</div>
