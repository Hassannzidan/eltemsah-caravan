<div>
  <div class="flex items-center gap-2 mb-2">
    <span *ngIf="subcategory" class="bg-orange-100 text-orange-700 px-3 py-1 rounded-full text-sm font-medium">
      {{ subcategory }}
    </span>
    <span class="text-slate-500 text-sm">{{ category }}</span>
  </div>
  <h1 class="text-3xl font-bold text-slate-900 mb-4">{{ name }}</h1>
  <p class="text-slate-600 text-lg leading-relaxed">{{ longDescription }}</p>
</div>
