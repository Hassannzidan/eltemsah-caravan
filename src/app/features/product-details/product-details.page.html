<div class="min-h-screen bg-slate-50 mt-10 px-4 sm:px-6 md:px-8 lg:px-12  py-6 sm:py-8 md:py-10 lg:py-12">

    <!-- Product Details -->
    <main *ngIf="product; else notFound" class="container mx-auto px-4 py-4  ">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 items-start">
        <!-- Product Gallery -->
        <app-product-image-gallery 
          [images]="product.images" 
          [productName]="product.name" 
        />

        <!-- Product Info -->
        <section class="space-y-6">
          <app-product-info 
            [name]="product.name"
            [category]="product.category"
            [subcategory]="product.subcategory"
            [longDescription]="product.description"
          />

          <!-- Extra spacing for future use -->
          <div class="mt-5"></div>

          <!-- Features -->
          <app-product-features 
            *ngIf="isSectionVisible('features')"
            [features]="features"
          />

          <!-- Specifications -->
          <app-product-specification
            *ngIf="isSectionVisible('specifications')"
            [specifications]="product.productDetails?.specifications ?? []"
          />

          <!-- CTA and Trust -->
             <app-product-cta />
             <app-trust-indicators />
        </section>
      </div>
    </main>

    <!-- Not Found Template -->
    <ng-template #notFound>
      <div class="min-h-screen flex items-center justify-center px-4">
        <div class="text-center space-y-4">
          <h1 class="text-2xl font-bold text-slate-900">Product Not Found</h1>
          <a 
            routerLink="/services" 
            class="text-red-600 hover:text-red-700 transition-colors font-medium focus:outline-none focus:underline"
            aria-label="Back to Services Page"
          >
            ← Back to Services
          </a>
        </div>
      </div>
    </ng-template>
</div>
