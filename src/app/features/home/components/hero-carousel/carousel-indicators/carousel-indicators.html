<div class="absolute bottom-8 left-1/2 -translate-x-1/2 z-20">
      <div class="flex space-x-3">
        <button
          *ngFor="let _ of totalArray; let i = index"
          (click)="onIndicatorClick.emit(i)"
          [attr.aria-label]="'Go to slide ' + (i + 1)"
          class="w-3 h-3 rounded-full transition-all duration-300 hover:scale-125"
          [ngClass]="{
            'bg-red-500 scale-125 shadow-lg shadow-red-500/50': i === currentSlide,
            'bg-white/40 hover:bg-white/60': i !== currentSlide
          }"
        ></button>
      </div>
    </div>
