<div
  class="absolute inset-0 flex items-end justify-center pb-24 pointer-events-none"
>
  <div class="container mx-auto px-6 lg:px-8">
    <div class="max-w-4xl mx-auto text-center relative overflow-hidden">

      <!-- Title with Wipe Effect & Animation -->
      <div
        class="inline-flex items-center rounded-full border border-white/30 px-6 py-2 text-4xl font-semibold text-white bg-gradient-to-r from-red-600/90 via-red-500 to-red-600/90 backdrop-blur-md relative overflow-hidden "
      >
        <!-- Wipe animation INSIDE the title element and ON TOP -->
        <div
          class="absolute inset-0 bg-gradient-to-r from-red-600 to-red-500 transition-transform duration-1000 ease-out"
          [ngClass]="{
            'translate-x-full': isActive,
            'translate-x-0': !isActive
          }"
          [ngStyle]="{
            transformOrigin: 'left',
            zIndex: 20
          }"
        ></div>

        <!-- Animated Title Text -->
        <span
          class="relative z-30 transition-all duration-[800ms] ease-out"
          [ngClass]="{
            'opacity-100 translate-y-0': isActive,
            'opacity-0 translate-y-8': !isActive
          }"
          [ngStyle]="{
            transitionDelay: isActive ? '1200ms' : '0ms'
          }"
        >
          {{ slide.title | translate }}
        </span>
      </div>

      <!-- Decorative Circles -->
      <div
        class="absolute -top-20 -left-20 w-40 h-40 border border-red-500/20 rounded-full "
      ></div>
      <div
        class="absolute -bottom-16 -right-16 w-32 h-32 border border-red-500/30 rounded-full "
        style="animation-delay: 1s"
      ></div>
    </div>
  </div>
</div>
