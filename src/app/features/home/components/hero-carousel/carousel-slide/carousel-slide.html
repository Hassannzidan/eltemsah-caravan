<div
  class="absolute inset-0 w-full h-full bg-cover bg-center transition-opacity duration-1000"
  [ngStyle]="{
    'background-image': 'url(' + slide.image + ')',
    'opacity': isActive ? '1' : '0',
    'z-index': isActive ? '10' : '0'
  }"
>
  <!-- ✅ Black Transparent Overlay -->
  <div class="absolute inset-0 bg-black/40 z-10"></div>

  <!-- Animated Overlay -->
  <app-animated-overlay
    [slide]="slide"
    [isActive]="isActive"
    class="z-20"
  ></app-animated-overlay>

<!-- ✅ Wipe Effect Container -->
  <div class="container mx-auto px-4 sm:px-6 lg:px-8 h-full flex items-center justify-center">
    <div class="relative w-full max-w-4xl overflow-hidden text-center">

     <!-- ✅ Wipe Effect Rectangle -->
       <!-- class="absolute top-0 left-0 w-full 
        h-24 sm:h-32 md:h-full bg-gradient-to-r from-red-600 to-red-500 transition-transform duration-1000 ease-out" -->
      <div
       
        [class.translate-x-full]="isActive"
        [class.translate-x-0]="!isActive"
        style="transform-origin: left; z-index: 30"
      ></div>
    </div>
  </div>
</div>
