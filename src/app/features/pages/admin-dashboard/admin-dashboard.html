<section class="space-y-12 mt-25">
  <div class="min-h-screen bg-slate-50">
    <!-- Header -->
    <div class="bg-white border-b border-gray-100">
      <div class="container mx-auto px-4 sm:px-6 py-6">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
          <div>
            <h1 class="text-3xl sm:text-4xl font-bold text-slate-900">Admin Dashboard</h1>
            <p class="text-slate-500 mt-1">Manage your products and services</p>
          </div>
          <div class="flex flex-wrap gap-3">
            <button
              (click)="openAddForm()"
              aria-label="Add new product"
              class="bg-red-800 hover:bg-red-700 hover:-translate-y-1 transition-all delay-50 text-white px-4 py-2 rounded-lg font-medium flex items-center"
            >
              <ng-icon [name]="lucidePlus" class="w-4 h-4 mr-2"></ng-icon>
              Add Product
            </button>

            <button
              (click)="logout()"
              aria-label="Logout"
              class="border border-red-200 text-red-600 hover:bg-red-50 hover:text-red-700 rounded-md px-5 py-1.5"
            >
              <ng-icon name="lucideLogOut" class="w-5 h-5 mr-2"></ng-icon>
              Logout
            </button>

            <app-add-product-dialog
              *ngIf="isFormOpen()"
              [editingProduct]="editingProduct()"
              [categories]="categories"
              (cancel)="isFormOpen.set(false)"
              (closeDialog)="isFormOpen.set(false)"
              (saveSuccess)="addCreatedProduct($event)"
            />
            <app-confirm-delete-dialog
            *ngIf="productToDelete()"
            [productName]="productToDelete()?.name ?? ''"
            (cancel)="productToDelete.set(null)"
            (confirmDelete)="confirmFinalDelete()"
          />

          </div>
        </div>
      </div>
    </div>

    <!-- Filter Bar -->
    <app-search-filter-bar
      [searchTerm]="searchTerm()"
      (searchTermChange)="searchTerm.set($event)"
      [selectedCategory]="selectedCategory()"
      (selectedCategoryChange)="selectedCategory.set($event)"
      [viewMode]="viewMode()"
      (viewModeChange)="viewMode.set($event)"
      [categories]="categories"
      [filteredProductsCount]="filteredProducts().length"
      [showStatusFilter]="true"
      [statusFilter]="statusFilter()"
      (statusFilterChange)="statusFilter.set($event)"
    />

    <!-- Products View -->
    <div [ngSwitch]="viewMode()" class="container mx-auto px-4 sm:px-6 py-8">
      <!-- Grid View -->
      <div *ngSwitchCase="'grid'" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <div
          *ngFor="let product of filteredProducts()"
          class="bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-lg group transition-shadow w-full"
        >
          <div class="relative h-48 overflow-hidden rounded-t-lg">
            <img
              [src]="product.images[0]"
              [alt]="product.name"
              loading="lazy"
              class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
            />
            <div class="absolute top-3 right-3 flex gap-2">
              <button
                class="px-2 py-0.5 rounded-xl text-xs font-semibold border transition-colors"
                [ngClass]="
                  product.status === 'active'
                    ? 'bg-red-900 text-white hover:bg-red-800'
                    : 'bg-gray-200 text-gray-900 hover:bg-gray-300'
                "
              >
                {{ product.status }}
              </button>
            </div>
          </div>

          <div class="flex flex-col space-y-1.5 p-6 pb-3">
            <h2 class="text-lg font-semibold text-gray-900">{{ product.name }}</h2>
            <span class="text-sm text-slate-500">{{ product.category }}</span>
          </div>

          <div class="p-6 pt-0">
            <p class="text-sm text-slate-600 mb-4 line-clamp-2">{{ product.description }}</p>

            <div class="flex flex-wrap gap-1 mb-4">
              <span
                *ngFor="let tag of product.tags"
                class="inline-flex items-center rounded-full border border-gray-300/80 px-2.5 py-0.5 text-xs text-gray-800 font-semibold"
              >
                {{ tag }}
              </span>
            </div>

            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="text-sm text-slate-600">Status:</span>
                <label [attr.aria-label]="'Toggle status for ' + product.name" class="inline-flex items-center cursor-pointer">
                  <input
                    type="checkbox"
                    class="sr-only peer"
                    [checked]="product.status === 'active'"
                    (change)="toggleStatus(product._id)"
                  />
                  <div
                    class="w-11 h-6 bg-gray-200 rounded-full peer-focus:ring-4 peer-focus:ring-red-800 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full after:absolute after:top-0.5 after:left-[2px] after:bg-white after:border after:border-gray-300 after:rounded-full after:h-5 after:w-5 after:transition-transform peer-checked:bg-red-800 relative"
                  ></div>
                </label>
              </div>
              <div class="flex gap-2">
                <button
                  aria-label="Edit product"
                  class="h-10 w-10 border border-gray-300 bg-white rounded-md hover:bg-red-100 hover:text-red-800 transition-colors"
                  (click)="openEditForm(product)"
                >
                  <ng-icon name="lucideSquarePen" class="w-4 h-4 mx-auto"></ng-icon>
                </button>
                <button
                  aria-label="Delete product"
                  class="h-10 w-10 border border-gray-300 bg-white rounded-md hover:bg-red-100 hover:text-red-800 transition-colors"
                  (click)="productToDelete.set(product)"
                >
                  <ng-icon name="lucideTrash2" class="w-4 h-4 mx-auto"></ng-icon>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- List View -->
      <div *ngSwitchCase="'list'" class="space-y-4">
        <div
          *ngFor="let product of filteredProducts()"
          class="flex flex-col sm:flex-row items-start sm:items-center border border-gray-300 rounded-lg bg-white shadow-sm overflow-hidden hover:shadow-lg transition-shadow"
        >
          <div class="w-full sm:w-32 h-48 sm:h-32">
            <img
              [src]="product.images[0]"
              [alt]="product.name"
              loading="lazy"
              class="w-full h-full object-cover"
            />
          </div>
          <div class="flex-1 p-4 sm:p-6 w-full">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center">
              <div>
                <h3 class="text-lg sm:text-xl font-bold text-slate-900">{{ product.name }}</h3>
                <p class="text-sm text-red-600 font-medium mt-1">{{ product.category }}</p>
                <p class="text-slate-600 mt-2 text-sm">{{ product.description }}</p>
                <div class="flex flex-wrap gap-1 mt-2">
                  <span
                    *ngFor="let tag of product.tags"
                    class="inline-flex items-center rounded-full border border-gray-300/80 px-2.5 py-0.5 text-xs text-gray-800 font-semibold"
                  >
                    {{ tag }}
                  </span>
                </div>
              </div>
              <div class="flex gap-2 mt-4 sm:mt-0 sm:ml-6">
                <label [attr.aria-label]="'Toggle status for ' + product.name" class="inline-flex items-center cursor-pointer">
                  <input
                    type="checkbox"
                    class="sr-only peer"
                    [checked]="product.status === 'active'"
                    (change)="toggleStatus(product._id)"
                  />
                  <div
                    class="w-11 h-6 bg-gray-200 rounded-full peer-focus:ring-4 peer-focus:ring-red-800 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full after:absolute after:top-0.5 after:left-[2px] after:bg-white after:border after:border-gray-300 after:rounded-full after:h-5 after:w-5 after:transition-transform peer-checked:bg-red-800 relative"
                  ></div>
                </label>
                <button
                  aria-label="Edit product"
                  class="h-10 w-10 border border-gray-300 bg-white rounded-md hover:bg-red-100 hover:text-red-800"
                  (click)="openEditForm(product)"
                >
                  <ng-icon name="lucideSquarePen" class="w-4 h-4 mx-auto"></ng-icon>
                </button>
                <button
                  aria-label="Delete product"
                  class="h-10 w-10 border border-gray-300 bg-white rounded-md hover:bg-red-100 hover:text-red-800"
                  (click)="productToDelete.set(product)"
                >
                  <ng-icon name="lucideTrash2" class="w-4 h-4 mx-auto"></ng-icon>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
