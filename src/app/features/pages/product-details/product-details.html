<div class="min-h-screen bg-slate-50">
  <!-- Navigation -->
  <nav class="bg-white border-b border-gray-300 sticky top-14 z-10 mt-20 shadow-sm" aria-label="Back Navigation">
    <div class="container mx-auto px-4 py-4">
      <a 
        [routerLink]="['/services']" 
        class="inline-flex items-center gap-2 text-gray-600 hover:text-red-600 transition-colors border rounded-lg p-2 hover:bg-red-50 font-semibold focus:outline-none focus:ring-2 focus:ring-red-400"
        aria-label="Back to Services"
      >
        <ng-icon name="lucideArrowBigLeftDash" class="w-5 h-5 text-2xl text-gray-900" aria-hidden="true" />
        <span>Back to Services</span>
      </a>
    </div>
  </nav>

  <!-- Product Details -->
  <main *ngIf="product; else notFound" class="container mx-auto px-4 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 items-start">
      <!-- Product Gallery -->
      <app-product-image-gallery 
        [images]="product.images" 
        [productName]="product.name" 
      />

      <!-- Product Info -->
      <section class="space-y-6">
        <app-product-info 
          [name]="product.name"
          [category]="product.category"
          [subcategory]="product.subcategory"
          [longDescription]="product.description"
        />

        <!-- Extra spacing for future use -->
        <div class="mt-5"></div>

        <!-- Features -->
        <app-product-features 
          *ngIf="isSectionVisible('features')"
          [features]="features"
        />

        <!-- Specifications -->
        <app-product-specification
          *ngIf="isSectionVisible('specifications')"
          [specifications]="getFlatSpecifications(product.productDetails?.specifications)"
        />

        <!-- CTA and Trust -->
        <app-product-cta />
        <app-trust-indicators />
      </section>
    </div>
  </main>

  <!-- Not Found Template -->
  <ng-template #notFound>
    <div class="min-h-screen flex items-center justify-center px-4">
      <div class="text-center space-y-4">
        <h1 class="text-2xl font-bold text-slate-900">Product Not Found</h1>
        <a 
          routerLink="/services" 
          class="text-red-600 hover:text-red-700 transition-colors font-medium focus:outline-none focus:underline"
          aria-label="Back to Services Page"
        >
          ← Back to Services
        </a>
      </div>
    </div>
  </ng-template>
</div>
