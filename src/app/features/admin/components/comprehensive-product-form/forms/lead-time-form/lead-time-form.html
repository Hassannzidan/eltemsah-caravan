<div class="space-y-4">
  <!-- Production Lead Time -->
  <div>
    <label class="block text-sm font-medium text-gray-700">Production Lead Time</label>
    <input
      class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50"
      type="text"
      [ngModel]="leadTime.production"
      (ngModelChange)="onChangeLeadTime('production', $event)"
    />
  </div>

  <!-- Delivery Lead Time -->
  <div>
    <label class="block text-sm font-medium text-gray-700">Delivery Lead Time</label>
    <input
      class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50"
      type="text"
      [ngModel]="leadTime.delivery"
      (ngModelChange)="onChangeLeadTime('delivery', $event)"
    />
  </div>

  <!-- Customization Lead Time -->
  <div>
    <label class="block text-sm font-medium text-gray-700">Customization Lead Time</label>
    <input
      class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50"
      type="text"
      [ngModel]="leadTime.customization"
      (ngModelChange)="onChangeLeadTime('customization', $event)"
    />
  </div>

  <!-- Availability -->
  <div>
    <label class="block text-sm font-medium text-gray-700">Availability</label>
    <select
      class="mt-1 block w-full rounded-md border border-gray-300 bg-white shadow-sm focus:border-blue-500 focus:outline-none focus:ring-blue-500 sm:text-sm"
      [ngModel]="availability"
      (ngModelChange)="onChangeAvailability($event)"
    >
      <option value="" disabled>Select availability</option>
      <option value="In Stock">In Stock</option>
      <option value="Out of Stock">Out of Stock</option>
      <option value="Pre-order">Pre-order</option>
    </select>
  </div>
</div>
